[project]
name = "weather-risk-agent"
version = "0.1.0"
description = "Weather Risk Intelligence Agent: ranks logistics hubs by weather-disruption exposure"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=8.0", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
